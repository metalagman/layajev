[project]
name = "laya-go-export"
version = "1.0.0"
description = "Offline reference and export tooling for official Laya checkpoints"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "onnx==1.23.0",
  "onnxruntime==1.30.0",
  "onnxscript==0.7.2",
  "safetensors==0.8.0",
  "tokenizers==0.23.2",
  "torch==2.14.0",
  "transformers==5.17.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
